[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa-mbhb"
version = "0.2.0"
description = "LISA MBHB waveforms (PyCBC), TDI response, SciRDv1 noise, and GWLENS lensing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shashwat Singh" }]
requires-python = ">=3.11"
dependencies = [
    "numpy", "scipy", "matplotlib", "astropy", "h5py", "mpmath", "pycbc",
    "gwlens>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/SSingh087/lisa-mbhb"
Issues = "https://github.com/SSingh087/lisa-mbhb/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["lisa_mbhb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
